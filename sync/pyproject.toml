[project]
name = "stocker-sync"
version = "0.1.0"
description = "Copy new stock quotes from homelab Postgres to Supabase."
requires-python = ">=3.14"
dependencies = ["pg8000>=1.31.5"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
