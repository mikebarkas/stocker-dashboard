# Serves the built web app (web/dist). Host Caddy sits in front: it does
# TLS, compression, and sends /graphql to the API container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed file names (index-C9JnOBxs.js) change whenever the content
    # does, so browsers may cache them for a year. A missing one is a 404,
    # not the app's HTML.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app. Paths like /symbol/MSFT are routes in the
    # browser, not files, so they get index.html and React Router takes
    # over. index.html is never cached, so a deploy shows up on the next
    # page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
