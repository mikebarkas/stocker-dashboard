name: sync image

# Push a tag like sync-v0.1.0 to publish ghcr.io/<owner>/stocker-sync:0.1.0.
on:
  push:
    tags: ["sync-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU runs the arm64 build steps on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag from the git tag (sync-v0.1.0 -> 0.1.0). Also adds OCI labels,
      # including org.opencontainers.image.source, which links the
      # package to this repo on GitHub.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stocker-sync
          tags: type=match,pattern=sync-v(.*),group=1

      - uses: docker/build-push-action@v7
        with:
          context: sync
          file: sync/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
